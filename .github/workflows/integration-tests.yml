# ============================================================================
# Integration Tests Workflow — Testing Pyramid Layer 2 (Middle)
# ============================================================================
# Runs on push to main/develop and on PRs. Medium feedback loop (~3-5 min).
# Tests FastAPI endpoints via TestClient with mocked Odoo/OCR backends.
# Also runs Odoo module tests against a real PostgreSQL database.
# ============================================================================

name: "🔗 Integration Tests"

on:
  workflow_call: {}
  push:
    branches: "!main"
    paths:
      - "api_gateway/fastapi_app/**"
      - "addons/edu_mangment/**"
      - "tests/integration/**"
      - "tests/conftest.py"
      - "tests/requirements-test.txt"
      - ".github/workflows/integration-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "api_gateway/fastapi_app/**"
      - "addons/edu_mangment/**"
      - "tests/integration/**"
      - "tests/conftest.py"
      - "tests/requirements-test.txt"

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Job 1: FastAPI Integration Tests (TestClient + mocked backends)
  # ════════════════════════════════════════════════════════════════════════════
  fastapi-integration:
    name: "FastAPI Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integration-${{ hashFiles('tests/requirements-test.txt', 'api_gateway/fastapi_app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-integration-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api_gateway/fastapi_app/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run FastAPI integration tests
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            -m integration \
            --junitxml=reports/integration-test-results.xml \
            --cov=api_gateway/fastapi_app \
            --cov-report=xml:reports/integration-coverage.xml \
            --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          JWT_ALGORITHM: HS256
          JWT_EXPIRATION_HOURS: "1"
          OCR_SERVICE_URL: http://mock-ocr:5000
          ODOO_URL: http://mock-odoo:8069

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastapi-integration-results
          path: reports/
          retention-days: 30

      - name: Add coverage comment to PR
        uses: MishaKav/pytest-coverage-comment@main
        if: github.event_name == 'pull_request'
        with:
          pytest-xml-coverage-path: reports/integration-coverage.xml
          junitxml-path: reports/integration-test-results.xml
          title: "📊 Integration Test Coverage"

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2: Odoo Module Tests (requires PostgreSQL)
  # ════════════════════════════════════════════════════════════════════════════
  odoo-module-tests:
    name: "Odoo Module Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # PostgreSQL service container for Odoo
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: odoo_test
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-odoo-${{ hashFiles('odoo/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-odoo-

      # ── Install Odoo system dependencies ──────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            libxml2-dev \
            libxslt1-dev \
            libldap2-dev \
            libsasl2-dev \
            libssl-dev \
            libjpeg-dev \
            libfreetype6-dev \
            zlib1g-dev \
            wkhtmltopdf

      - name: Install Odoo Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r odoo/requirements.txt 2>/dev/null || echo "Odoo requirements installed with warnings"

      # ── Run Odoo module tests ─────────────────────────────────────────────
      - name: Run edu_mang_admission tests
        run: |
          python odoo/odoo-bin \
            --addons-path=odoo/addons,addons/edu_mangment,addons/open_edu_cat \
            -d odoo_test \
            -i edu_mang_admission \
            --test-enable \
            --test-tags=edu_mang_admission \
            --stop-after-init \
            --log-level=test \
            --no-http \
            2>&1 | tee reports/odoo-admission-tests.log
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: odoo
          PGPASSWORD: odoo_test_password
        continue-on-error: true

      - name: Run custom_registration tests
        run: |
          python odoo/odoo-bin \
            --addons-path=odoo/addons,addons/edu_mangment,addons/open_edu_cat \
            -d odoo_test \
            -i custom_registration \
            --test-enable \
            --test-tags=custom_registration \
            --stop-after-init \
            --log-level=test \
            --no-http \
            2>&1 | tee reports/odoo-registration-tests.log
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: odoo
          PGPASSWORD: odoo_test_password
        continue-on-error: true

      # ── Parse Odoo test results ───────────────────────────────────────────
      - name: Check Odoo test results
        run: |
          echo "=== Admission Module Tests ==="
          if grep -q "ERROR" reports/odoo-admission-tests.log 2>/dev/null; then
            echo "❌ Admission tests had errors"
            grep "ERROR" reports/odoo-admission-tests.log | tail -20
          else
            echo "✅ Admission tests passed"
          fi

          echo ""
          echo "=== Registration Module Tests ==="
          if grep -q "ERROR" reports/odoo-registration-tests.log 2>/dev/null; then
            echo "❌ Registration tests had errors"
            grep "ERROR" reports/odoo-registration-tests.log | tail -20
          else
            echo "✅ Registration tests passed"
          fi

      - name: Upload Odoo test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odoo-test-logs
          path: reports/
          retention-days: 30
