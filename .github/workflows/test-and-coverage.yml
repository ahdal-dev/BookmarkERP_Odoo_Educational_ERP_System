# ============================================================================
# Test & Coverage Pipeline — FastAPI + Odoo + SonarCloud
# ============================================================================
# Unified workflow that:
#   1. Runs FastAPI/microservice tests (pytest-cov) → coverage.xml
#   2. Runs Odoo custom module tests (coverage.py) → coverage_odoo.xml
#   3. Uploads both reports to SonarCloud for quality gate analysis
#
# Required GitHub Secrets:
#   SONAR_TOKEN          — SonarCloud authentication token
#
# Required GitHub Variables (or hardcode in sonar-project.properties):
#   SONAR_ORGANIZATION   — Your SonarCloud organization key
#   SONAR_PROJECT_KEY    — Your SonarCloud project key
# ============================================================================

name: "📊 Test & Coverage"

on:
  push:
    branches: "!*main"
    paths:
      - "api_gateway/fastapi_app/**"
      - "services/**"
      - "addons/edu_mangment/**"
      - "tests/**"
      - "pyproject.toml"
      - ".coveragerc"
      - "sonar-project.properties"
      - ".github/workflows/test-and-coverage.yml"
  pull_request:
    branches: [main, develop]
 

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

# ════════════════════════════════════════════════════════════════════════════
# JOB 1: FastAPI & Microservices — pytest-cov
# ════════════════════════════════════════════════════════════════════════════
jobs:
  fastapi-coverage:
    name: "🐍 FastAPI Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for SonarCloud blame

      # ── Python setup ────────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── Cache ───────────────────────────────────────────────────────────
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-fastapi-${{ matrix.python-version }}-${{ hashFiles( 'api_gateway/fastapi_app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-fastapi-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      # ── Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api_gateway/fastapi_app/requirements.txt
          
      # ── Run unit + integration tests with coverage ──────────────────────
      - name: Run tests with coverage
        run: |
          mkdir -p reports

          pytest tests/unit/ tests/integration/ \
            -v \
            --tb=short \
            --junitxml=reports/fastapi-test-results.xml \
            --cov=api_gateway \
            --cov=services \
            --cov-config=pyproject.toml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            
        env:
          PYTHONPATH: ${{ github.workspace }}
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          JWT_ALGORITHM: HS256
          JWT_EXPIRATION_HOURS: "1"
          OCR_SERVICE_URL: http://mock-ocr:5000
          ODOO_URL: http://mock-odoo:8069

      # ── Upload coverage artifacts ───────────────────────────────────────
      # Only upload from the primary matrix version (3.12) to avoid duplication
      - name: Upload FastAPI coverage report
        uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: fastapi-coverage-report
          path: |
            coverage.xml
            reports/fastapi-test-results.xml
            htmlcov/
          retention-days: 30

      # ── PR coverage comment ─────────────────────────────────────────────
      - name: Add coverage comment to PR
        uses: MishaKav/pytest-coverage-comment@main
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: reports/fastapi-test-results.xml
          title: "📊 FastAPI Test Coverage"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Odoo Custom Modules — coverage.py wrapping odoo-bin
  # ════════════════════════════════════════════════════════════════════════════
  odoo-coverage:
    name: "🏢 Odoo Module Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: odoo_test
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Cache ───────────────────────────────────────────────────────────
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-odoo-${{ hashFiles('odoo/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-odoo-

      # ── System dependencies (Odoo native libs) ─────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            libxml2-dev \
            libxslt1-dev \
            libldap2-dev \
            libsasl2-dev \
            libssl-dev \
            libjpeg-dev \
            libfreetype6-dev \
            zlib1g-dev \
            wkhtmltopdf

      # ── Python dependencies ────────────────────────────────────────────
      - name: Install Odoo Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage
          pip install -r odoo/requirements.txt 2>/dev/null || echo "::warning::Some Odoo requirements had install warnings"

      # ── Create CI-specific Odoo config ─────────────────────────────────
      - name: Create Odoo test config
        run: |
          cat > /tmp/odoo-ci.conf <<EOF
          [options]
          db_name = odoo_test
          db_host = localhost
          db_port = 5432
          db_user = odoo
          db_password = odoo_test_password
          addons_path = ${{ github.workspace }}/odoo/addons,${{ github.workspace }}/addons/edu_mangment,${{ github.workspace }}/addons/open_edu_cat
          admin_passwd = admin
          http_port = 8069
          without_demo = True
          EOF

      # ── Run Odoo tests under coverage ──────────────────────────────────
      - name: Run Odoo module tests with coverage
        run: |
          mkdir -p reports

          # Erase any previous coverage data
          coverage erase

          # Run all custom modules under coverage instrumentation
          coverage run \
            --rcfile=.coveragerc \
            odoo/odoo-bin \
            -c /tmp/odoo-ci.conf \
            -d odoo_test \
            -u custom_registration,edu_mang_admission,edu_mang_auth,edu_mang_petition,edu_mang_website,edu_portal_gateway \
            --test-enable \
            --stop-after-init \
            --log-level=test \
            --no-http \
            2>&1 | tee reports/odoo-test-output.log
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: odoo
          PGPASSWORD: odoo_test_password

      # ── Generate reports ────────────────────────────────────────────────
      - name: Generate Odoo coverage reports
        if: always()
        run: |
          echo "=== Odoo Coverage Report ==="
          coverage report --rcfile=.coveragerc || true
          coverage html --rcfile=.coveragerc    || true
          coverage xml --rcfile=.coveragerc     || true

          echo ""
          echo "HTML report → htmlcov_odoo/index.html"
          echo "XML  report → coverage_odoo.xml"

      # ── Enforce threshold ───────────────────────────────────────────────
      

      # ── Check Odoo test logs for errors ────────────────────────────────
      - name: Check Odoo test results
        if: always()
        run: |
          echo "=== Checking Odoo test output for errors ==="
          if grep -qE "(ERROR|FAIL)" reports/odoo-test-output.log 2>/dev/null; then
            echo "::error::Odoo tests reported errors:"
            grep -E "(ERROR|FAIL)" reports/odoo-test-output.log | tail -30
            exit 1
          else
            echo "✅ No errors detected in Odoo test output"
          fi

      # ── Upload artifacts ────────────────────────────────────────────────
      - name: Upload Odoo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odoo-coverage-report
          path: |
            coverage_odoo.xml
            htmlcov_odoo/
            reports/odoo-test-output.log
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: SonarCloud Analysis — Consumes both coverage XML reports
  # ════════════════════════════════════════════════════════════════════════════
  sonarcloud:
    name: "🔍 SonarCloud Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fastapi-coverage, odoo-coverage]
    if: always() && (needs.fastapi-coverage.result == 'success' || needs.odoo-coverage.result == 'success')

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for accurate blame/duplication

      # ── Download FastAPI coverage XML ───────────────────────────────────
      - name: Download FastAPI coverage report
        uses: actions/download-artifact@v4
        with:
          name: fastapi-coverage-report
          path: reports/fastapi/
        continue-on-error: true

      # ── Download Odoo coverage XML ──────────────────────────────────────
      - name: Download Odoo coverage report
        uses: actions/download-artifact@v4
        with:
          name: odoo-coverage-report
          path: reports/odoo/
        continue-on-error: true

      # ── Prepare coverage files for Sonar ────────────────────────────────
      - name: Prepare coverage reports
        run: |
          echo "=== Available Coverage Reports ==="
          find reports/ -name "*.xml" -type f 2>/dev/null || echo "No XML reports found"
          echo ""

          # Fix paths in coverage.xml if needed (CI absolute → relative)
          if [ -f reports/fastapi/coverage.xml ]; then
            echo "✅ FastAPI coverage.xml found"
            # Replace absolute workspace path with relative paths
            sed -i "s|${{ github.workspace }}/||g" reports/fastapi/coverage.xml
          else
            echo "⚠️  FastAPI coverage.xml not found"
          fi

          if [ -f reports/odoo/coverage_odoo.xml ]; then
            echo "✅ Odoo coverage_odoo.xml found"
            sed -i "s|${{ github.workspace }}/||g" reports/odoo/coverage_odoo.xml
          else
            echo "⚠️  Odoo coverage_odoo.xml not found"
          fi

      # ── SonarCloud Scan ─────────────────────────────────────────────────
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

      # ── Post scan status ────────────────────────────────────────────────
      - name: SonarCloud Quality Gate
        run: |
          echo "============================================"
          echo " SonarCloud scan complete"
          echo " View results at: https://sonarcloud.io/dashboard?id=${{ vars.SONAR_PROJECT_KEY }}"
          echo "============================================"

  # ════════════════════════════════════════════════════════════════════════════
  # Final Status Gate
  # ════════════════════════════════════════════════════════════════════════════
  pipeline-status:
    name: "✅ Coverage Pipeline Status"
    runs-on: ubuntu-latest
    needs: [fastapi-coverage, odoo-coverage, sonarcloud]
    if: always()
    steps:
      - name: Evaluate pipeline result
        run: |
          echo "============================================"
          echo "   Test & Coverage Pipeline Results"
          echo "============================================"
          echo ""
          echo "FastAPI Coverage:  ${{ needs.fastapi-coverage.result }}"
          echo "Odoo Coverage:     ${{ needs.odoo-coverage.result }}"
          echo "SonarCloud:        ${{ needs.sonarcloud.result }}"
          echo ""

          FAILED=0

          if [[ "${{ needs.fastapi-coverage.result }}" == "failure" ]]; then
            echo "❌ FastAPI coverage job failed"
            FAILED=1
          fi

          if [[ "${{ needs.odoo-coverage.result }}" == "failure" ]]; then
            echo "❌ Odoo coverage job failed"
            FAILED=1
          fi

          if [[ "${{ needs.sonarcloud.result }}" == "failure" ]]; then
            echo "⚠️  SonarCloud scan failed (non-blocking)"
          fi

          if [[ $FAILED -eq 1 ]]; then
            echo ""
            echo "============================================"
            echo " ❌  PIPELINE FAILED"
            echo "============================================"
            exit 1
          fi

          echo "============================================"
          echo " ✅  ALL CHECKS PASSED"
          echo "============================================"
