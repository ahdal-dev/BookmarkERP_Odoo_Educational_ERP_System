name: "MLflow Model Tracking"

on:
  push:
    branches-ignore: [main]
    paths:
      - "services/**"
      - "tests/**"
      - ".github/workflows/mlflow-model-tracking.yml"
      - "scripts/mlflow_*.py"

  pull_request:
    branches: [main]

  schedule:
    - cron: "0 2 * * 0"

concurrency:
  group: mlflow-tracking-${{ github.ref }}
  cancel-in-progress: false

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

# =========================================================
# JOB 1 - Student Performance
# =========================================================
jobs:

  student-performance-tracking:
    name: "Student Performance Service"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "services/Student Perfromance Service/requirements.txt"
          pip install mlflow==2.10.2 pytest pytest-cov

      - name: Run tracking
        run: |
          python scripts/mlflow_track_student_performance.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          PYTHONPATH: ${{ github.workspace }}

# =========================================================
# JOB 2 - Grade Predictor
# =========================================================
  grade-predictor-tracking:
    name: "Grade Predictor Service"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "services/grade_predictor_service/requirements.txt"
          pip install mlflow==2.10.2 pytest pytest-cov

      - name: Run tracking
        run: |
          python scripts/mlflow_track_grade_predictor.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          PYTHONPATH: ${{ github.workspace }}

# =========================================================
# JOB 3 - OCR Service
# =========================================================
  ocr-service-tracking:
    name: "OCR Service"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ocr/requirements.txt
          pip install mlflow==2.10.2 pytest pytest-cov

      - name: Run tracking
        run: |
          python scripts/mlflow_track_ocr_service.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          PYTHONPATH: ${{ github.workspace }}

# =========================================================
# JOB 4 - Generate Report
# =========================================================
  generate-mlflow-report:
    name: "Generate MLflow Report"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - student-performance-tracking
      - grade-predictor-tracking
      - ocr-service-tracking

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas plotly pyyaml

      - name: Generate report
        run: |
          python scripts/mlflow_generate_report.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-report
          path: |
            mlflow_report.html
            mlflow_metrics_summary.json
          retention-days: 90

# =========================================================
# JOB 5 - Archive ONLY report outputs
# =========================================================
  archive-results:
    name: "Archive Results"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: generate-mlflow-report

    steps:
      - uses: actions/checkout@v4

      - name: Create archive
        run: |
          mkdir -p model_results_archive
          tar -czf model_results_archive/report_${{ github.run_number }}.tar.gz \
            mlflow_report.html mlflow_metrics_summary.json || true

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: model-results-archive-${{ github.run_number }}
          path: model_results_archive/
          retention-days: 365

      - name: Print summary
        run: |
          echo "MLflow Tracking Complete"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Timestamp: $(date -Iseconds)"