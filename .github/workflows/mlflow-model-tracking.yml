name: "MLflow Model Tracking"

on:
  push:
    branches-ignore: [main]
    paths:
      - "services/**"
      - "tests/**"
      - ".github/workflows/mlflow-model-tracking.yml"
      - "scripts/mlflow_*.py"

  pull_request:
    branches: [main]

  schedule:
    - cron: "0 2 * * 0"

concurrency:
  group: mlflow-tracking-${{ github.ref }}
  cancel-in-progress: false

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  ARTIFACTS_PATH: mlflow_artifacts

jobs:

# =========================================================
# JOB 1 - Setup / sanity check MLflow connection
# =========================================================
  setup-mlflow:
    name: "Setup MLflow Tracking"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MLflow
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.10.2 pyyaml

      - name: Validate MLflow connection
        run: |
          python - << 'EOF'
          import mlflow
          import os

          uri = os.environ["MLFLOW_TRACKING_URI"]
          mlflow.set_tracking_uri(uri)

          print("Using MLflow:", uri)

          # simple validation
          try:
              exp = mlflow.get_experiment_by_name("ci-validation")
              if exp is None:
                  mlflow.create_experiment("ci-validation")
              print("MLflow connection OK")
          except Exception as e:
              raise RuntimeError(f"MLflow connection failed: {e}")
          EOF

# =========================================================
# JOB 2 - Student Performance
# =========================================================
  student-performance-tracking:
    name: "Student Performance Service"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup-mlflow

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "services/Student Perfromance Service/requirements.txt"
          pip install mlflow==2.10.2 pytest pytest-cov

      - name: Run tracking
        run: |
          python scripts/mlflow_track_student_performance.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          PYTHONPATH: ${{ github.workspace }}

# =========================================================
# JOB 3 - Grade Predictor
# =========================================================
  grade-predictor-tracking:
    name: "Grade Predictor Service"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup-mlflow

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "services/grade_predictor_service/requirements.txt"
          pip install mlflow==2.10.2 pytest pytest-cov

      - name: Run tracking
        run: |
          python scripts/mlflow_track_grade_predictor.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          PYTHONPATH: ${{ github.workspace }}

# =========================================================
# JOB 4 - OCR Service
# =========================================================
  ocr-service-tracking:
    name: "OCR Service"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup-mlflow

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ocr/requirements.txt
          pip install mlflow==2.10.2 pytest pytest-cov

      - name: Run tracking
        run: |
          python scripts/mlflow_track_ocr_service.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          PYTHONPATH: ${{ github.workspace }}

# =========================================================
# JOB 5 - Generate Report (READS from MLflow server)
# =========================================================
  generate-mlflow-report:
    name: "Generate MLflow Report"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - student-performance-tracking
      - grade-predictor-tracking
      - ocr-service-tracking

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas plotly pyyaml

      - name: Generate report
        run: |
          python scripts/mlflow_generate_report.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-report
          path: |
            mlflow_report.html
            mlflow_metrics_summary.json
          retention-days: 90

# =========================================================
# JOB 6 - Archive results (optional local reporting only)
# =========================================================
  archive-results:
    name: "Archive Results"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: generate-mlflow-report

    steps:
      - uses: actions/checkout@v4

      - name: Create archive
        run: |
          mkdir -p model_results_archive
          tar -czf model_results_archive/results_${{ github.run_number }}.tar.gz .

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: model-results-archive-${{ github.run_number }}
          path: model_results_archive/
          retention-days: 365

      - name: Print summary
        run: |
          echo "MLflow Tracking Complete"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Timestamp: $(date -Iseconds)"