name: "MLflow Model Tracking"

on:
  push:
    branches-ignore: [main]
    paths:
      - "services/**"
      - "tests/**"
      - ".github/workflows/mlflow-model-tracking.yml"
      - "scripts/mlflow_*.py"

  pull_request:
    branches: [main]

  schedule:
    - cron: "0 2 * * 0"

concurrency:
  group: mlflow-tracking-${{ github.ref }}
  cancel-in-progress: false

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

# JOB 1 - Student Performance
jobs:

  student-performance-tracking:
    name: "Student Performance Service"
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'student performance') || github.event_name == 'schedule'
    
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "services/student_performance_service/requirements.txt"
          pip install mlflow==2.10.2 pytest pytest-cov

      - name: Run tracking
        run: |
          python services/student_performance_service/app/train.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          PYTHONPATH: ${{ github.workspace }}

# JOB 2 - Grade Predictor
  grade-predictor-tracking:
    name: "Grade Predictor Service"
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'grade predictor') || github.event_name == 'schedule'
    
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "services/grade_predictor_service/requirements.txt"
          pip install mlflow==2.10.2 pytest pytest-cov

      - name: Run tracking
        run: |
          python services/grade_predictor_service/train.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          PYTHONPATH: ${{ github.workspace }}

# JOB 3 - OCR Service
  ocr-service-tracking:
    name: "OCR Service"
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'ocr') || github.event_name == 'schedule'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ocr/requirements.txt
          pip install mlflow==2.10.2 pytest pytest-cov

      - name: Run tracking
        run: |
          python scripts/mlflow_track_ocr_service.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          PYTHONPATH: ${{ github.workspace }} 
