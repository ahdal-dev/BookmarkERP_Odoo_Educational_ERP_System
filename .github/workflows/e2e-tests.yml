name: "E2E Tests"

on:
  workflow_call: {}
  push:
    branches: ["!main"]
    paths:
      - "api_gateway/**"
      - "services/**"
      - "addons/**"
      
      - ".github/workflows/e2e-tests.yml"
  pull_request:
    branches: [main]

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel long-running E2E suites

jobs:
  e2e-tests:
    name: "End-to-End Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up Docker Buildx ──────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Cache Docker layers ───────────────────────────────────────────────
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('api_gateway/docker-compose.yml', 'api_gateway/fastapi_app/Dockerfile', 'services/ocr/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # ── Generate self-signed SSL certs for Nginx ──────────────────────────
      - name: Generate SSL certificates
        run: |
          mkdir -p api_gateway/nginx/ssl
          openssl req -x509 -nodes -days 1 \
            -newkey rsa:2048 \
            -keyout api_gateway/nginx/ssl/nginx.key \
            -out api_gateway/nginx/ssl/nginx.crt \
            -subj "/CN=localhost"

      # ── Create .env file ─────────────────────────────────────────────────
      - name: Create environment file
        run: |
          cat > api_gateway/.env << 'EOF'
          POSTGRES_PASSWORD=test_password_ci
          ODOO_PASSWORD=admin
          JWT_SECRET_KEY=e2e-test-secret-key-for-ci-pipeline
          REDIS_PASSWORD=redis_ci_test
          GRAFANA_PASSWORD=admin
          EOF

      # ── Start infrastructure ──────────────────────────────────────────────
      - name: Start Docker Compose stack
        working-directory: api_gateway
        run: |
          docker-compose up -d --build \
            nginx \
            fastapi_gateway \
            postgres \
            redis
          echo "Waiting for services to be healthy..."

      # ── Wait for services ─────────────────────────────────────────────────
      - name: Wait for FastAPI gateway
        run: |
          echo "Waiting for FastAPI gateway to be ready..."
          for i in $(seq 1 60); do
            if docker exec edu_erp_fastapi_gateway curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ FastAPI gateway is ready (attempt $i)"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ FastAPI gateway failed to start"
              docker-compose -f api_gateway/docker-compose.yml logs fastapi_gateway
              exit 1
            fi
            echo "  Waiting... (attempt $i/60)"
            sleep 5
          done

      - name: Wait for Nginx
        run: |
          echo "Waiting for Nginx to be ready..."
          for i in $(seq 1 30); do
            if curl -sf -k https://localhost/health > /dev/null 2>&1 || \
               curl -sf http://localhost/health > /dev/null 2>&1; then
              echo "✅ Nginx is ready (attempt $i)"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Nginx failed to start"
              docker-compose -f api_gateway/docker-compose.yml logs nginx
              exit 1
            fi
            echo "  Waiting... (attempt $i/30)"
            sleep 5
          done

      # ── Log service status ────────────────────────────────────────────────
      - name: Log service status
        if: always()
        run: |
          echo "=== Docker Container Status ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "=== Network Connectivity ==="
          curl -sf -k https://localhost/health || echo "Nginx HTTPS: unavailable"
          curl -sf http://localhost/health || echo "Nginx HTTP: unavailable"

      # ── Python setup for test runner ──────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api_gateway/fastapi_app/requirements.txt
       
      # ── Install Playwright browsers ───────────────────────────────────────
      - name: Install Playwright browsers
        if: ${{ !inputs.skip_ui_tests }}
        run: |
          playwright install chromium --with-deps

      # ── Run E2E API tests ─────────────────────────────────────────────────
      - name: Run E2E API tests
        run: |
          pytest tests/e2e/test_admission_flow_api.py \
            -v \
            --tb=long \
            -m e2e \
            --junitxml=reports/e2e-api-results.xml \
            2>&1 | tee reports/e2e-api-output.log
        env:
          PYTHONPATH: ${{ github.workspace }}
          E2E_GATEWAY_URL: ${{ inputs.gateway_url || 'https://localhost' }}
          E2E_VERIFY_SSL: "false"
          JWT_SECRET_KEY: e2e-test-secret-key-for-ci-pipeline

      # ── Run E2E UI tests (Playwright) ─────────────────────────────────────
      - name: Run E2E UI tests (Playwright)
        if: ${{ !inputs.skip_ui_tests }}
        run: |
          pytest tests/e2e/test_admission_flow_ui.py \
            -v \
            --tb=long \
            -m e2e \
            --junitxml=reports/e2e-ui-results.xml \
            2>&1 | tee reports/e2e-ui-output.log
        env:
          PYTHONPATH: ${{ github.workspace }}
          E2E_GATEWAY_URL: ${{ inputs.gateway_url || 'https://localhost' }}
          E2E_VERIFY_SSL: "false"
          PLAYWRIGHT_HEADLESS: "true"

      # ── Collect service logs on failure ────────────────────────────────────
      - name: Collect Docker logs on failure
        if: failure()
        working-directory: api_gateway
        run: |
          mkdir -p ../reports/docker-logs
          docker-compose logs --no-color nginx       > ../reports/docker-logs/nginx.log 2>&1
          docker-compose logs --no-color fastapi_gateway > ../reports/docker-logs/fastapi.log 2>&1
          docker-compose logs --no-color postgres     > ../reports/docker-logs/postgres.log 2>&1
          docker-compose logs --no-color redis        > ../reports/docker-logs/redis.log 2>&1

      # ── Upload results ────────────────────────────────────────────────────
      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: reports/
          retention-days: 30

      # ── Tear down ─────────────────────────────────────────────────────────
      - name: Tear down Docker Compose
        if: always()
        working-directory: api_gateway
        run: |
          docker-compose down -v --remove-orphans
