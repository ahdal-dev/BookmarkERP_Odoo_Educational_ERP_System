<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Performance Predictor</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="page">
    <header>
      <h1>🎓 Student Performance Predictor</h1>
      <p>Predict next-semester GPA and academic risk from historical transcript</p>
    </header>

    <div class="card">
      <h2>Student Info</h2>
      <div class="grid4">
        <label>Student ID
          <input id="student_id" placeholder="e.g. S20210042" />
        </label>
        <label>Program
          <input id="program" placeholder="e.g. Computer Science" value="Computer Science" />
        </label>
        <label>School
          <input id="school" placeholder="e.g. Engineering" value="Engineering" />
        </label>
        <label>Entry Year
          <input id="entry_year" type="number" min="2015" max="2030" value="2021" />
        </label>
      </div>
    </div>

    <div class="card">
      <div class="section-header">
        <h2>Transcript History</h2>
        <button class="btn-add" onclick="addSemester()">+ Add Semester</button>
      </div>
      <div id="semesters"></div>
    </div>

    <button class="btn-predict" onclick="runPredict()">Predict Performance</button>

    <div id="result"></div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
