<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Predictor</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="card">
    <h1>Grade Predictor</h1>

    <h2>Student Info</h2>
    <div class="grid2">
      <div>
        <label>Student ID</label>
        <input id="student_id" value="STU-2021-0042" placeholder="e.g. STU-2021-0042">
      </div>
      <div>
        <label>Target Course</label>
        <input id="target_course" value="MATH 301" placeholder="e.g. MATH 301">
      </div>
      <div>
        <label>Cumulative GPA (0 – 4)</label>
        <input id="cumulative_gpa" type="number" step="0.01" min="0" max="4" value="3.2">
      </div>
      <div>
        <label>Current Semester Credit Load</label>
        <input id="credit_load" type="number" min="1" max="24" value="15">
      </div>
    </div>

    <h2>Transcript History</h2>
    <div class="transcript-header">
      <span>Course ID</span>
      <span>Grade</span>
      <span>Semester</span>
      <span></span>
    </div>
    <div id="transcript-rows">
      <div class="transcript-row">
        <input placeholder="e.g. MATH 101" value="MATH 101">
        <select>
          <option>A</option><option>A-</option><option>B+</option>
          <option selected>B</option><option>B-</option><option>C+</option>
          <option>C</option><option>C-</option><option>D+</option>
          <option>D</option><option>F</option><option>W</option>
        </select>
        <input placeholder="e.g. Fall 2021" value="Fall 2021">
        <button class="btn-remove" onclick="removeRow(this)">✕</button>
      </div>
      <div class="transcript-row">
        <input placeholder="e.g. MATH 102" value="MATH 102">
        <select>
          <option>A</option><option>A-</option><option selected>B+</option>
          <option>B</option><option>B-</option><option>C+</option>
          <option>C</option><option>C-</option><option>D+</option>
          <option>D</option><option>F</option><option>W</option>
        </select>
        <input placeholder="e.g. Spring 2022" value="Spring 2022">
        <button class="btn-remove" onclick="removeRow(this)">✕</button>
      </div>
    </div>
    <button class="btn-add" onclick="addRow()">+ Add Course</button>

    <button class="btn-predict" onclick="runPredict()">Predict Grade</button>

    <div id="result"></div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
