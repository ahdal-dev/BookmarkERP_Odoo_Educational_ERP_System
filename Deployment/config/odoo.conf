[options]
# ============================================================================
# Production Odoo configuration (Docker, official odoo:19.0 image)
# ----------------------------------------------------------------------------
# DB credentials are intentionally OMITTED here. The official image injects
# them from the HOST/PORT/USER/PASSWORD environment variables set in
# docker-compose.app.yml (so the Postgres password never lives in this file).
# ============================================================================

# --- Database ---------------------------------------------------------------
db_name      = edu_demo_new
db_template  = template0
db_maxconn   = 64
# db_host / db_port / db_user / db_password come from the container env.

# --- Addons path ------------------------------------------------------------
# CRITICAL: the two custom directories are mounted into the container at
# /mnt/extra-addons/<dir>. The image's built-in core addons live at
# /usr/lib/python3/dist-packages/odoo/addons.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/open_edu_cat,/mnt/extra-addons/edu_mangment

# --- Master / admin password ------------------------------------------------
# Only gates the database manager, which we disable below (list_db = False).
# Override by rendering this file from a secret if you re-enable list_db.
admin_passwd = CHANGE_ME_master_password

# --- HTTP -------------------------------------------------------------------
http_enable    = True
http_interface = 0.0.0.0
http_port      = 8081
gevent_port    = 8072
# Behind nginx, which terminates TLS and sets X-Forwarded-* headers.
proxy_mode     = True

# --- Workers / performance --------------------------------------------------
# e2-standard-2 = 2 vCPU / 8 GB shared with pg/redis/rabbitmq/gateway.
workers              = 2
max_cron_threads     = 1
limit_memory_soft    = 1610612736   # 1.5 GB
limit_memory_hard    = 2147483648   # 2.0 GB
limit_time_cpu       = 120
limit_time_real      = 240
limit_request        = 8192

# --- Security ---------------------------------------------------------------
# Disable the web database manager and DB listing in production.
list_db        = False
dbfilter       = ^edu_demo_new$

# --- Misc -------------------------------------------------------------------
with_demo            = False
server_wide_modules  = base,web
log_level            = info
log_handler          = :INFO
csv_internal_sep     = ,
unaccent             = False
