# ============================================================================
# nginx.conf  ->  Proxy VM (e2-micro). Serves the React SPA + reverse-proxies
#                 the API gateway and (optionally) the Odoo backend.
# ----------------------------------------------------------------------------
# IMPORTANT: the upstreams below point at the App VM's INTERNAL IP. The default
# 10.0.0.11 matches var.app_internal_ip in Terraform. If you change that
# variable, update the two `server` lines in the upstream blocks here.
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;          # allow OCR document uploads

    # gzip --------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml font/woff2;

    # Rate limiting -----------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ocr_limit:10m rate=2r/s;

    # Upstreams (App VM internal IP) ------------------------------------------
    upstream fastapi_gateway {
        server 10.0.0.11:8000 max_fails=3 fail_timeout=30s;  # App VM gateway
        keepalive 32;
    }
    upstream odoo_backend {
        server 10.0.0.11:8081 max_fails=3 fail_timeout=30s;  # App VM Odoo HTTP
        keepalive 16;
    }
    upstream odoo_longpolling {
        server 10.0.0.11:8072 max_fails=3 fail_timeout=30s;  # App VM Odoo gevent
        keepalive 16;
    }

    # =========================================================================
    # HTTP server (port 80). For TLS, uncomment the 443 block below, mount real
    # certs into ./nginx/ssl, and switch this block to a 301 redirect.
    # =========================================================================
    server {
        listen 80 default_server;
        server_name _;

        # Local health endpoint for the container healthcheck.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # --- React SPA (static build) ----------------------------------------
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;   # client-side routing fallback
        }

        # Long-cache hashed assets
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # --- API gateway ------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://fastapi_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Tighter limit for the heavy OCR endpoint
        location /api/v1/extract-document {
            limit_req zone=ocr_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://fastapi_gateway;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 90s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Gateway health / docs passthrough
        location = /health { proxy_pass http://fastapi_gateway; proxy_set_header Host $host; access_log off; }
        location /docs     { proxy_pass http://fastapi_gateway; proxy_set_header Host $host; }
        location /openapi.json { proxy_pass http://fastapi_gateway; proxy_set_header Host $host; }

        # --- Odoo backend (optional admin access) ----------------------------
        # Exposes the Odoo web client at /web. Remove this block to keep Odoo
        # entirely private (frontend talks to it only through the gateway).
        location /web/ {
            proxy_pass http://odoo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Odoo websocket / longpolling
        location /websocket {
            proxy_pass http://odoo_longpolling;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }

        error_page 429 @ratelimit;
        location @ratelimit {
            default_type application/json;
            return 429 '{"error":"Rate limit exceeded. Try again later."}';
        }
        error_page 502 503 504 @gateway_down;
        location @gateway_down {
            default_type application/json;
            return 503 '{"error":"Service temporarily unavailable."}';
        }
    }

    # =========================================================================
    # HTTPS server (enable after placing certs in ./nginx/ssl). Then change the
    # port-80 block above to: `location / { return 301 https://$host$request_uri; }`
    # =========================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name erp.example.com;
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     # ... copy the location blocks from the port-80 server here ...
    # }
}
