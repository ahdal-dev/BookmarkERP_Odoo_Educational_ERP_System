# ============================================================================
# NGINX Configuration for Educational ERP API Gateway
# ============================================================================
# Purpose: Acts as reverse proxy with load balancing, rate limiting, and 
#          initial JWT validation for the Educational ERP microservices
# Author: FastAPI + NGINX Architecture
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========================================================================
    # Logging Configuration
    # ========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ========================================================================
    # Performance Optimization
    # ========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;  # Allow large file uploads for OCR documents

    # ========================================================================
    # Gzip Compression
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ========================================================================
    # Rate Limiting Configuration (Leaky Bucket Algorithm)
    # ========================================================================
    # Zone: admission_limit
    # Purpose: Prevent server overload during peak admission times
    # Strategy: Leaky bucket - allows bursts but maintains average rate
    # Limit: 5 requests per second per IP with burst capacity of 10
    # ========================================================================
    limit_req_zone $binary_remote_addr zone=admission_limit:10m rate=5r/s;
    
    # Zone for OCR endpoint (more restrictive due to heavy processing)
    limit_req_zone $binary_remote_addr zone=ocr_limit:10m rate=2r/s;
    
    # General API rate limit
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Connection limit per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ========================================================================
    # Upstream Configuration - FastAPI Gateway (Round-Robin Load Balancing)
    # ========================================================================
    # Multiple FastAPI instances for high availability
    # Default algorithm: Round-robin (cycles through servers sequentially)
    # ========================================================================
    upstream fastapi_gateway {
        least_conn;  # Use least connections for better distribution
        
        # Primary FastAPI Gateway instance
        server fastapi_gateway:8000 max_fails=3 fail_timeout=30s;
        
        # Additional instances for horizontal scaling (uncomment when needed)
        # server fastapi_gateway_2:8000 max_fails=3 fail_timeout=30s;
        # server fastapi_gateway_3:8000 max_fails=3 fail_timeout=30s;
        
        # Health check parameters
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # ========================================================================
    # Upstream Configuration - OCR Microservice (Direct Access for monitoring)
    # ========================================================================
    upstream ocr_service {
        server ocr_microservice:5000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ========================================================================
    # Upstream Configuration - Odoo ERP System
    # ========================================================================
    upstream odoo_backend {
        server odoo:8069 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ========================================================================
    # Map for JWT Token Validation Status
    # ========================================================================
    map $http_authorization $jwt_valid {
        default 0;
        "~^Bearer\s+[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+$" 1;
    }

    # ========================================================================
    # HTTP Server Block (Redirect to HTTPS in production)
    # ========================================================================
    server {
        listen 80;
        server_name api.edu-erp.local localhost;

        # Redirect all HTTP traffic to HTTPS (enable in production)
        # return 301 https://$server_name$request_uri;

        # For development, allow HTTP
        location / {
            return 301 https://$server_name$request_uri;
        }

        # Health check endpoint (accessible via HTTP)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ========================================================================
    # HTTPS Server Block - Main API Gateway Entry Point
    # ========================================================================
    server {
        listen 443 ssl http2;
        server_name api.edu-erp.local localhost;

        # SSL/TLS Configuration (replace with real certificates in production)
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ====================================================================
        # API Routes - FastAPI Gateway
        # ====================================================================
        
        # Route 1: OCR Document Extraction Endpoint
        # Rate Limited: 2 req/s with burst of 5
        # JWT Required: Yes
        location /api/v1/extract-document {
            # Apply OCR-specific rate limiting (more restrictive)
            limit_req zone=ocr_limit burst=5 nodelay;
            limit_req_status 429;
            
            # Connection limit
            limit_conn addr 10;

            # JWT Token Validation (basic check)
            if ($jwt_valid = 0) {
                return 401 '{"error": "Missing or invalid JWT token"}';
            }

            # Proxy to FastAPI Gateway
            proxy_pass http://fastapi_gateway;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # Upload settings for document processing
            proxy_request_buffering off;
            client_body_buffer_size 128k;
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            
            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Route 2: Admission Application Endpoint
        # Rate Limited: 5 req/s with burst of 10 (admission season traffic)
        # JWT Required: Yes
        location /api/v1/admissions/apply {
            # Apply admission-specific rate limiting
            limit_req zone=admission_limit burst=10 nodelay;
            limit_req_status 429;
            
            # Connection limit
            limit_conn addr 10;

            # JWT Token Validation
            if ($jwt_valid = 0) {
                return 401 '{"error": "Missing or invalid JWT token"}';
            }

            # Proxy to FastAPI Gateway
            proxy_pass http://fastapi_gateway;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Route 3: Orchestration Endpoint (Document Upload + Auto-Apply)
        # Rate Limited: 2 req/s (combines OCR + Admission processing)
        # JWT Required: Yes
        location /api/v1/admissions/submit-with-document {
            # More restrictive due to combined operations
            limit_req zone=ocr_limit burst=3 nodelay;
            limit_req_status 429;
            
            # Connection limit
            limit_conn addr 5;

            # JWT Token Validation
            if ($jwt_valid = 0) {
                return 401 '{"error": "Missing or invalid JWT token"}';
            }

            # Proxy to FastAPI Gateway
            proxy_pass http://fastapi_gateway;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # Extended timeouts for orchestrated operations
            proxy_request_buffering off;
            client_body_buffer_size 128k;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # General API routes (catch-all for other FastAPI endpoints)
        location /api/ {
            # General API rate limiting
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            
            # Connection limit
            limit_conn addr 15;

            # Proxy to FastAPI Gateway
            proxy_pass http://fastapi_gateway;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # Standard timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check and metrics endpoints (no rate limiting)
        location /health {
            access_log off;
            proxy_pass http://fastapi_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /metrics {
            access_log off;
            # Restrict to internal monitoring systems
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            
            proxy_pass http://fastapi_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # OpenAPI/Swagger Documentation
        location /docs {
            proxy_pass http://fastapi_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://fastapi_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Custom error pages
        error_page 429 @ratelimit;
        location @ratelimit {
            default_type application/json;
            return 429 '{"error": "Rate limit exceeded. Please try again later.", "retry_after": "$http_retry_after"}';
        }

        error_page 502 503 504 @gateway_error;
        location @gateway_error {
            default_type application/json;
            return 503 '{"error": "Service temporarily unavailable. Please try again."}';
        }
    }
}
