apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
  labels:
    app: edu-erp
    component: nginx-gateway
data:
  nginx.conf: |
    # ================================================================
    # NGINX Configuration for Educational ERP API Gateway
    # ================================================================
    # Purpose: Acts as reverse proxy with load balancing and routing
    # for the Educational ERP microservices architecture
    # ================================================================

    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # ============================================================
        # Logging Configuration
        # ============================================================
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

        access_log /var/log/nginx/access.log main;

        # ============================================================
        # Performance Optimization
        # ============================================================
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 20M;

        # ============================================================
        # Gzip Compression
        # ============================================================
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript 
                   application/json application/javascript application/xml+rss;

        # ============================================================
        # Rate Limiting
        # ============================================================
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=1r/s;

        # ============================================================
        # Upstream Servers (Service Discovery via Kubernetes DNS)
        # ============================================================
        upstream fastapi_backend {
            server fastapi-service:8000 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        upstream odoo_backend {
            server odoo-service:8069 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        upstream ocr_backend {
            server ocr-service:5000 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        # ============================================================
        # Health Check Endpoint
        # ============================================================
        server {
            listen 80;
            server_name _;
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }

        # ============================================================
        # Main Server Block - HTTP Redirect to HTTPS (production)
        # ============================================================
        server {
            listen 80 default_server;
            server_name _;

            # Redirect all HTTP to HTTPS in production (optional)
            # return 301 https://$server_name$request_uri;

            # API Gateway Routes
            location /api/v1/ {
                limit_req zone=api_limit burst=20 nodelay;
                proxy_pass http://fastapi_backend/;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }

            # FastAPI Health Endpoint
            location /health {
                proxy_pass http://fastapi_backend/health;
                access_log off;
            }

            # Odoo Routes
            location /odoo/ {
                limit_req zone=api_limit burst=20 nodelay;
                proxy_pass http://odoo_backend/;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }

            # OCR Service Routes
            location /api/v1/ocr/ {
                limit_req zone=strict_limit burst=5 nodelay;
                proxy_pass http://ocr_backend/;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_request_body_in_file_only on;
                proxy_request_body_in_single_buffer off;
                proxy_connect_timeout 120s;
                proxy_send_timeout 120s;
                proxy_read_timeout 120s;
            }

            # Root endpoint
            location / {
                proxy_pass http://fastapi_backend/;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Error pages
            error_page 502 503 504 /50x.html;
            location = /50x.html {
                root /usr/share/nginx/html;
            }
        }

        # ============================================================
        # HTTPS Server Block (Uncomment in production with real certs)
        # ============================================================
        # server {
        #     listen 443 ssl http2 default_server;
        #     server_name _;
        #
        #     ssl_certificate /etc/nginx/ssl/cert.pem;
        #     ssl_certificate_key /etc/nginx/ssl/key.pem;
        #
        #     ssl_protocols TLSv1.2 TLSv1.3;
        #     ssl_ciphers HIGH:!aNULL:!MD5;
        #     ssl_prefer_server_ciphers on;
        #     ssl_session_cache shared:SSL:10m;
        #     ssl_session_timeout 10m;
        #
        #     # Same location blocks as above HTTP server...
        # }
    }
