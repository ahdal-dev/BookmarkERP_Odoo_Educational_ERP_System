apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default
  labels:
    app: edu-erp
    component: nginx-gateway
    version: v1
  annotations:
    description: "NGINX reverse proxy and API gateway for external traffic"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: edu-erp
      component: nginx-gateway
  template:
    metadata:
      labels:
        app: edu-erp
        component: nginx-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      # Pod anti-affinity for distributed deployment
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - nginx-gateway
              topologyKey: kubernetes.io/hostname

      containers:
      - name: nginx
        image: nginx:1.25-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP

        # ====================================================================
        # Environment Variables
        # ====================================================================
        env:
        - name: TZ
          value: "Africa/Cairo"

        # ====================================================================
        # Resource Requests & Limits
        # ====================================================================
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"

        # ====================================================================
        # Liveness Probe - Checks if NGINX process is running
        # ====================================================================
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        # ====================================================================
        # Readiness Probe - Checks if NGINX is ready to serve traffic
        # ====================================================================
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
          successThreshold: 1

        # ====================================================================
        # Volume Mounts
        # ====================================================================
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-conf-d
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: nginx-logs
          mountPath: /var/log/nginx
        - name: ssl-certs
          mountPath: /etc/nginx/ssl
          readOnly: true
        - name: tmp
          mountPath: /tmp

        # ====================================================================
        # Security Context
        # ====================================================================
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
          readOnlyRootFilesystem: false

      # ====================================================================
      # Pod-level Security Context
      # ====================================================================
      securityContext:
        fsGroup: 101

      # ====================================================================
      # Service Account
      # ====================================================================
      serviceAccountName: nginx-sa

      # ====================================================================
      # Volumes
      # ====================================================================
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: nginx-conf-d
        configMap:
          name: nginx-conf-d
      - name: nginx-logs
        emptyDir: {}
      - name: ssl-certs
        secret:
          secretName: edu-erp-secrets
          items:
          - key: TLS_CERT
            path: cert.pem
          - key: TLS_KEY
            path: key.pem
      - name: tmp
        emptyDir: {}

      # ====================================================================
      # Restart Policy
      # ====================================================================
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      # DNS Configuration
      dnsPolicy: ClusterFirst
