apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: default
  labels:
    app: edu-erp
    component: nginx-gateway
  annotations:
    description: "LoadBalancer service for external access to NGINX gateway"
    service.spec.externalTrafficPolicy: "Local"
spec:
  type: LoadBalancer
  selector:
    app: edu-erp
    component: nginx-gateway
  
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP

  # For NodePort alternative, uncomment and change type to NodePort:
  # type: NodePort
  # ports:
  # - name: http
  #   port: 80
  #   targetPort: 80
  #   nodePort: 30080
  #   protocol: TCP
  # - name: https
  #   port: 443
  #   targetPort: 443
  #   nodePort: 30443
  #   protocol: TCP

  sessionAffinity: None
  externalTrafficPolicy: Local
