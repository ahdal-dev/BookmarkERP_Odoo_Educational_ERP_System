apiVersion: v1
kind: Service
metadata:
  name: nginx-exporter-service
  namespace: default
  labels:
    app: edu-erp
    component: nginx-exporter
    tier: observability
  annotations:
    description: "ClusterIP service for Nginx Prometheus Exporter — scraped by Prometheus"
spec:
  type: ClusterIP
  selector:
    app: edu-erp
    component: nginx-exporter
  ports:
    - name: metrics
      port: 9113
      targetPort: 9113
      protocol: TCP
  sessionAffinity: None
