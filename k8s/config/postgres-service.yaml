apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: default
  labels:
    app: edu-erp
    component: postgres-db
  annotations:
    description: "Internal ClusterIP service for PostgreSQL database"
spec:
  type: ClusterIP
  selector:
    app: edu-erp
    component: postgres-db
  
  ports:
  - name: sql
    port: 5432
    targetPort: 5432
    protocol: TCP

  sessionAffinity: None
