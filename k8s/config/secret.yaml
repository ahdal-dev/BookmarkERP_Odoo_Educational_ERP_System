apiVersion: v1
kind: Secret
metadata:
  name: edu-erp-secrets
  namespace: default
  labels:
    app: edu-erp
    component: config
type: Opaque
stringData:
  # Odoo Database Credentials
  ODOO_USERNAME: "admin"
  ODOO_PASSWORD: "change-me-in-production"
  
  # JWT Secret Key (use strong value in production)
  JWT_SECRET_KEY: "your-super-secret-jwt-key-change-in-production-at-least-32-chars"
  
  # Database Connection (PostgreSQL for Odoo)
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_USER: "odoo"
  DB_PASSWORD: "odoo-db-password-change-me"
  DB_NAME: "odoo_db"
  
  # SSL/TLS Certificates (base64 encoded - populate with real certs)
  TLS_CERT: "LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t"
  TLS_KEY: "LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t"
