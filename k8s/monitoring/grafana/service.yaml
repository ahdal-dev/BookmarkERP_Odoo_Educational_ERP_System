apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
  labels:
    app: edu-erp
    component: grafana
    tier: observability
  annotations:
    description: "NodePort service for Grafana — accessible at http://<node-ip>:30300"
spec:
  type: NodePort
  selector:
    app: edu-erp
    component: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30300     # Access Grafana at http://<node-ip>:30300
      protocol: TCP
  sessionAffinity: None
