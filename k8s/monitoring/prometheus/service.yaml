apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
  labels:
    app: edu-erp
    component: prometheus
    tier: observability
  annotations:
    description: "ClusterIP service for Prometheus server — internal access only"
spec:
  type: ClusterIP
  selector:
    app: edu-erp
    component: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      protocol: TCP
  sessionAffinity: None
