apiVersion: v1
kind: Service
metadata:
  name: ocr-service
  namespace: default
  labels:
    app: edu-erp
    component: ocr-service
  annotations:
    description: "Internal ClusterIP service for OCR microservice pod discovery"
spec:
  type: ClusterIP
  selector:
    app: edu-erp
    component: ocr-service
  
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    protocol: TCP

  sessionAffinity: None
