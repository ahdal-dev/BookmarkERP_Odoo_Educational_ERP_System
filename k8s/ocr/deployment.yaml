apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-deployment
  namespace: default
  labels:
    app: edu-erp
    component: ocr-service
    version: v1
  annotations:
    description: "OCR microservice for AI-based document processing"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: edu-erp
      component: ocr-service
  template:
    metadata:
      labels:
        app: edu-erp
        component: ocr-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      # Pod anti-affinity for distributed deployment
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - ocr-service
              topologyKey: kubernetes.io/hostname

      containers:
      - name: ocr
        image: ocr-service:latest  # Update with your registry/image
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP

        # ====================================================================
        # Environment Variables - Injected from ConfigMap & Secrets
        # ====================================================================
        envFrom:
        - configMapRef:
            name: edu-erp-config
        - secretRef:
            name: edu-erp-secrets

        env:
        - name: FLASK_ENV
          value: "production"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: TZ
          value: "Africa/Cairo"

        # ====================================================================
        # Resource Requests & Limits (GPU recommended for OCR workloads)
        # ====================================================================
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
            # Uncomment if using GPU:
            # nvidia.com/gpu: "1"
          limits:
            memory: "1Gi"
            cpu: "1000m"
            # nvidia.com/gpu: "1"

        # ====================================================================
        # Liveness Probe - HTTP endpoint check
        # ====================================================================
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1

        # ====================================================================
        # Readiness Probe - Checks if OCR service is ready
        # ====================================================================
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
          successThreshold: 1

        # ====================================================================
        # Volume Mounts
        # ====================================================================
        volumeMounts:
        - name: model-files
          mountPath: /app/models
          readOnly: true
        - name: upload-dir
          mountPath: /app/uploads
        - name: tmp
          mountPath: /tmp

        # ====================================================================
        # Security Context
        # ====================================================================
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false

      # ====================================================================
      # Pod-level Security Context
      # ====================================================================
      securityContext:
        fsGroup: 1000

      # ====================================================================
      # Service Account
      # ====================================================================
      serviceAccountName: ocr-sa

      # ====================================================================
      # Volumes
      # ====================================================================
      volumes:
      - name: model-files
        emptyDir: {}  # In production, use PersistentVolume for models
      - name: upload-dir
        emptyDir: {}  # For temporary uploads during processing
      - name: tmp
        emptyDir: {}

      # ====================================================================
      # Restart Policy
      # ====================================================================
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      # DNS Configuration
      dnsPolicy: ClusterFirst
