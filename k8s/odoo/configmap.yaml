apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: default
  labels:
    app: edu-erp
    component: odoo-erp
data:
  odoo.conf: |
    [options]
    # Database Configuration
    db_host = postgres-service
    db_port = 5432
    db_user = odoo
    db_password = odoo-db-password-change-me
    db_name = odoo_db
    
    # Server Configuration
    addons_path = /mnt/extra-addons
    admin_passwd = change-me-in-production
    
    # Performance Settings
    workers = 4
    timeout = 600
    
    # Longpolling Configuration
    longpolling_port = 8072
    
    # Logging
    log_level = info
    log_file = /var/log/odoo/odoo.log
    
    # CSV/Excel Import
    csv_import_res_partner_address = True
    
    # Security
    secure_cookies = True
    httponly = True
    samesite = Lax
