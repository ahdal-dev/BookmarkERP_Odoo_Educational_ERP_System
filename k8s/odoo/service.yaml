apiVersion: v1
kind: Service
metadata:
  name: odoo-service
  namespace: default
  labels:
    app: edu-erp
    component: odoo-erp
  annotations:
    description: "Internal ClusterIP service for Odoo ERP pod discovery"
spec:
  type: ClusterIP
  selector:
    app: edu-erp
    component: odoo-erp
  
  ports:
  - name: web
    port: 8069
    targetPort: 8069
    protocol: TCP
  - name: longpolling
    port: 8072
    targetPort: 8072
    protocol: TCP

  sessionAffinity: None
