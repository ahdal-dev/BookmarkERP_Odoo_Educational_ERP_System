apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: default
  labels:
    app: edu-erp
    component: fastapi-gateway
  annotations:
    description: "Internal ClusterIP service for FastAPI Gateway pod discovery"
spec:
  type: ClusterIP
  selector:
    app: edu-erp
    component: fastapi-gateway
  
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP

  # Session affinity for stateful connections (optional)
  sessionAffinity: None
