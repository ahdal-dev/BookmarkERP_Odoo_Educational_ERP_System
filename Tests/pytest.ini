# ============================================================================
# Pytest Configuration — Educational ERP Testing Pyramid
# ============================================================================
# Usage:
#   pytest tests/unit/ -m unit            # Layer 1 only
#   pytest tests/integration/ -m integration  # Layer 2 only
#   pytest tests/e2e/ -m e2e             # Layer 3 only
#   pytest tests/ -v                     # All layers
# ============================================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode for pytest-asyncio
asyncio_mode = auto

# Custom markers for the testing pyramid
markers =
    unit: Unit tests — isolated logic, no I/O (Layer 1)
    integration: Integration tests — TestClient with mocked backends (Layer 2)
    e2e: End-to-end tests — full stack through Nginx gateway (Layer 3)
    slow: Tests that take more than 5 seconds
    perf: Performance / load tests — require live services, not run in CI

# Default options: verbose output, short tracebacks, show locals
addopts =
    --strict-markers
    --tb=short
    --showlocals
    -q

# Minimum pytest version required
minversion = 7.0

# Ignore directories that are not test code
norecursedirs =
    venv
    env
    .venv
    node_modules
    __pycache__
    .git
    odoo
    data
    logs
    notebooks
