# ============================================================================
# SonarCloud Configuration — Educational ERP System
# ============================================================================
# This file is read by the sonarsource/sonarcloud-github-action.
# Some properties are overridden via CLI args in the workflow for flexibility.
#
# Setup checklist:
#   1. Go to https://sonarcloud.io → Your Organization → Create Project
#   2. Set SONAR_TOKEN as a GitHub repository secret
#   3. Set SONAR_ORGANIZATION and SONAR_PROJECT_KEY as GitHub repository variables
#   4. Replace the placeholder values below with your actual keys
# ============================================================================

# ── Project Identification ──────────────────────────────────────────────────
# These can also be passed via -D args in the workflow (takes precedence)
sonar.projectKey=YOUR_SONAR_PROJECT_KEY
sonar.organization=YOUR_SONAR_ORGANIZATION

sonar.projectName=Educational ERP System
sonar.projectVersion=1.0.0

# ── Source Configuration ────────────────────────────────────────────────────
# Directories containing source code to analyze
sonar.sources=api_gateway/fastapi_app,services/ocr,services/grade_predector,addons/edu_mangment

# Directories containing test code (excluded from duplication/coverage analysis)
sonar.tests=tests

# Language & encoding
sonar.language=py
sonar.sourceEncoding=UTF-8

# ── Python-Specific Settings ───────────────────────────────────────────────
sonar.python.version=3.12

# ── Coverage Reports ───────────────────────────────────────────────────────
# Both coverage XML files generated by the CI pipeline.
# Paths are relative to the repository root.
sonar.python.coverage.reportPaths=reports/fastapi/coverage.xml,reports/odoo/coverage_odoo.xml

# ── Test Reports (JUnit XML) ──────────────────────────────────────────────
sonar.python.xunit.reportPath=reports/fastapi/reports/fastapi-test-results.xml

# ── Exclusions ─────────────────────────────────────────────────────────────
# Files/directories to exclude from analysis entirely
sonar.exclusions=\
  odoo/**,\
  addons/open_edu_cat/**,\
  venv/**,\
  env/**,\
  .venv/**,\
  node_modules/**,\
  **/__pycache__/**,\
  **/static/**,\
  **/migrations/**,\
  **/*.min.js,\
  **/*.min.css,\
  k8s/**,\
  data/**,\
  logs/**,\
  notebooks/**,\
  docs/**

# Files to exclude from duplication detection
sonar.cpd.exclusions=\
  **/tests/**,\
  **/__manifest__.py,\
  **/__init__.py

# Files to exclude from coverage measurement (already omitted in .coveragerc)
sonar.coverage.exclusions=\
  **/tests/**,\
  **/test_*.py,\
  **/__init__.py,\
  **/__manifest__.py,\
  **/conftest.py,\
  **/static/**,\
  **/data/**,\
  **/demo/**,\
  **/security/**

# ── Quality Gate ───────────────────────────────────────────────────────────
# Use SonarCloud's default "Sonar way" quality gate, or configure your own
# at https://sonarcloud.io → Your Project → Quality Gates
# sonar.qualitygate.wait=true
