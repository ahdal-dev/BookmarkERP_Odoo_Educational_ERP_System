# ============================================================================
# Project Configuration — Educational ERP System
# ============================================================================

# --------------------------------------------------------------------------
# Pytest Configuration
# --------------------------------------------------------------------------
# Mirrors settings from tests/pytest.ini, consolidated here for tooling.
# If both files exist, pytest uses pytest.ini first. Consider removing
# pytest.ini once you verify everything works from pyproject.toml alone.
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
minversion = "7.0"

markers = [
    "unit: Unit tests — isolated logic, no I/O (Layer 1)",
    "integration: Integration tests — TestClient with mocked backends (Layer 2)",
    "e2e: End-to-end tests — full stack through Nginx gateway (Layer 3)",
    "slow: Tests that take more than 5 seconds",
]

addopts = [
    "--strict-markers",
    "--tb=short",
    "--showlocals",
    "-q",
]

norecursedirs = [
    "venv",
    "env",
    ".venv",
    "node_modules",
    "__pycache__",
    ".git",
    "odoo",
    "data",
    "logs",
    "notebooks",
]


# --------------------------------------------------------------------------
# Coverage Configuration (pytest-cov)
# --------------------------------------------------------------------------

[tool.coverage.run]
# Measure branch coverage in addition to statement coverage
branch = true

# Paths to measure — adjust to your source packages
source = [
    "api_gateway",
    "services",
]

# Files and directories to exclude from coverage measurement
omit = [
    "*/tests/*",
    "*/test_*",
    "tests/*",
    "*/__init__.py",
    "venv/*",
    "env/*",
    ".venv/*",
    "*/migrations/*",
    "*/conftest.py",
]

[tool.coverage.report]
# ── Minimum coverage threshold ──────────────────────────────────────────
# The build will fail (exit code 2) if total coverage drops below 80%.
fail_under = 70

# Show lines that were not executed
show_missing = true

# Skip files with 100% coverage to reduce noise in output
skip_covered = true

# Exclude common patterns from coverage accounting
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
    "if TYPE_CHECKING:",
]

# Floating-point precision for percentages
precision = 2

[tool.coverage.html]
# Output directory for the HTML coverage report
directory = "htmlcov"

[tool.coverage.xml]
# Output path for the XML coverage report (consumed by CI tools / Codecov)
output = "coverage.xml"
